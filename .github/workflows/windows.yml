name: windows

on:
  push:
    branches: [ master ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10
    - name: Build
      run: dotnet build -c Release
